kind = "web"
previewPath = "/"
title = "SnapBuy"
version = "1.0.0"
id = "artifacts/snapbuy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19081

[services.development]
run = "pnpm --filter @workspace/snapbuy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/snapbuy", "run", "build" ]
serve = "static"
publicDir = "artifacts/snapbuy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19081"
BASE_PATH = "/"
